<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="description" content="Klondike solitaire with 3D cards and a 3D card preview.">
  <title>Solitaire</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='6' fill='%23fdfbf5'/%3E%3Cpath d='M32 20c-9 9-13 13-13 19a7 7 0 0 0 11 5c-1 4-2 6-4 8h12c-2-2-3-4-4-8a7 7 0 0 0 11-5c0-6-4-10-13-19z' fill='%231d2230'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
  <div id="app" class="app">
    <canvas id="fx-back" class="fx-layer fx-layer--back" aria-hidden="true"></canvas>

    <header id="hud" class="hud"></header>

    <main id="table" class="table" aria-label="Solitaire table">
      <div id="piles" class="piles"></div>
      <div id="cards" class="cards"></div>
    </main>

    <footer id="toolbar" class="toolbar"></footer>

    <canvas id="fx-front" class="fx-layer fx-layer--front" aria-hidden="true"></canvas>

    <div id="overlay-root" class="overlay-root"></div>
    <div id="inspector-root" class="inspector-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <noscript>
    <p style="color:#fff;font-family:sans-serif;text-align:center;padding:2rem">Solitaire needs JavaScript to run.</p>
  </noscript>

  <!-- Classic scripts on purpose: the game must also run from file:// (no ES modules). Order matters. -->
  <script src="js/core/bus.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/platform.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/solver.js"></script>
  <script src="js/view/anim.js"></script>
  <script src="js/view/fx.js"></script>
  <script src="js/view/audio.js"></script>
  <script src="js/view/cards.js"></script>
  <script src="js/view/board.js"></script>
  <script src="js/view/celebrate.js"></script>
  <script src="js/view/input.js"></script>
  <script src="js/view/inspector.js"></script>
  <script src="js/view/ui.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
